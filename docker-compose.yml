services:
  dell-rss:
    build: .
    # Or use the published multi-arch image instead of building:
    # image: ghcr.io/dragonsecurity/dell-rss:latest
    container_name: dell-rss
    restart: unless-stopped

    ports:
      - "8088:8088"

    environment:
      DELL_MODEL: R640          # model served at /rss.xml
      REFRESH_INTERVAL: 6h
      PORT: 8088
      LOG_LEVEL: info
      # PUBLIC_URL: https://dell-rss.example.com   # adds atom:link rel="self" to feeds

    volumes:
      # Catalog cache: restarts serve immediately and revalidate with a 304.
      - dell-rss-cache:/data

    read_only: true
    stop_grace_period: 20s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

volumes:
  dell-rss-cache:
